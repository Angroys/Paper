# Lints: flutter_lints (recommended set) plus a few strictness rules.
# Generated code is excluded; it is produced by gen-l10n / build_runner.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
    - macos/**
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
